name: Build debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compilar
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            errs=$( (grep -E "^e: " build.log | head -40; grep -A8 "What went wrong" build.log | head -20) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Errores de compilación::${errs}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
